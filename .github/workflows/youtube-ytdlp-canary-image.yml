name: Build MediaBridge-GPT provider yt-dlp canary image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - youtube-canary/**
      - Dockerfile.youtube-ytdlp-canary
      - docker/start-ytdlp-canary.sh
      - .github/workflows/youtube-ytdlp-canary-image.yml
  push:
    branches:
      - main
    paths:
      - youtube-canary/**
      - Dockerfile.youtube-ytdlp-canary
      - docker/start-ytdlp-canary.sh
      - .github/workflows/youtube-ytdlp-canary-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: "youtube-ytdlp-canary-image-${{ github.ref }}"
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mediabridge-youtube-ytdlp-canary

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run canary unit tests
        run: cd youtube-canary && python3 -m unittest -v

      - name: Validate startup script
        run: sh -n docker/start-ytdlp-canary.sh

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build provider yt-dlp canary image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.youtube-ytdlp-canary
          target: youtube-ytdlp-canary
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
