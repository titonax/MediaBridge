# Build every proposed change, but deploy Pages only from main.
name: Build and deploy MediaBridge-GPT web to Pages

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - web/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/pages.yml
      - docs/github-pages.md
  push:
    branches:
      - main
    paths:
      - web/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/pages.yml
      - docs/github-pages.md

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WEB_BASE_PATH: /${{ github.event.repository.name }}
      WEB_DEFAULT_API: https://mediabridge-api-production.up.railway.app/

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify remote processing API
        shell: bash
        run: |
          case "$WEB_DEFAULT_API" in
            https://*) ;;
            *)
              echo "WEB_DEFAULT_API must use HTTPS"
              exit 1
              ;;
          esac

          health_url="${WEB_DEFAULT_API%/}/healthz"
          response=""

          for attempt in 1 2 3 4 5; do
            echo "health check attempt $attempt: $health_url"
            if response="$(curl -fsS --max-time 30 "$health_url")"; then
              break
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep 10
            fi
          done

          if [ -z "$response" ]; then
            echo "processing API did not return a health payload"
            exit 1
          fi

          status="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.status ?? ""))' "$response")"
          service="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.service ?? ""))' "$response")"

          echo "processing API status=$status service=$service"

          test "$status" = "ok"
          test "$service" = "mediabridge-api"

      - name: Check web
        run: pnpm --dir web check

      - name: Build web
        run: pnpm --dir web build

      - name: Verify Pages artifact
        shell: bash
        run: |
          test -f web/build/index.html
          test -f web/build/404.html
          test -d web/build/_app
          test -d web/build/_libav
          grep -q "${WEB_BASE_PATH}/" web/build/index.html

          if grep -R -q 'localhost:9000' web/build; then
            echo "localhost API leaked into Pages artifact"
            exit 1
          fi

          if grep -R -q 'api.example.invalid' web/build; then
            echo "invalid placeholder API leaked into Pages artifact"
            exit 1
          fi

          if ! grep -R -q 'mediabridge-api-production.up.railway.app' web/build; then
            echo "remote MediaBridge-GPT API is missing from Pages artifact"
            exit 1
          fi

          echo "Pages artifact looks valid."

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./web/build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
