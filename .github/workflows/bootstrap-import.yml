name: Bootstrap MediaBridge from cobalt snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-import.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MediaBridge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source snapshot
        run: |
          git clone --depth 1 --branch main https://github.com/titonax/cobalt.git /tmp/cobalt-source

      - name: Replace repository contents
        run: |
          rsync -a --delete --exclude '.git' /tmp/cobalt-source/ ./
          rm -f .github/workflows/bootstrap-import.yml

      - name: Commit independent baseline
        run: |
          git config user.name "MediaBridge bootstrap"
          git config user.email "74790560+titonax@users.noreply.github.com"
          git add -A
          git commit -m "chore: import cobalt baseline into MediaBridge"
          git push origin HEAD:main
