services:
  cobalt-api:
    build:
      context: .
      target: api
    image: titonax/cobalt-api:local
    container_name: cobalt-api-local
    init: true
    read_only: true
    restart: unless-stopped

    # Keep the test API reachable only from this computer.
    ports:
      - "127.0.0.1:9000:9000"

    environment:
      API_URL: "http://localhost:9000/"
      API_LISTEN_ADDRESS: "0.0.0.0"
      CORS_WILDCARD: "1"
