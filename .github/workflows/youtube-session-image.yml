name: Build MediaBridge-GPT YouTube-session image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - api/**
      - packages/**
      - Dockerfile.youtube-session
      - docker/start-youtube-session.sh
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/youtube-session-image.yml
  push:
    branches:
      - main
    paths:
      - api/**
      - packages/**
      - Dockerfile.youtube-session
      - docker/start-youtube-session.sh
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/youtube-session-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: "youtube-session-image-${{ github.ref }}"
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mediabridge-api-youtube-session

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate startup script
        run: sh -n docker/start-youtube-session.sh

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build YouTube-session API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.youtube-session
          target: api-youtube-session
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
